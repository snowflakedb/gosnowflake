name: Build and Test

# Coverage.txt from each test job is uploaded as a GHA artifact named
# coverage-*. Jenkins gosnowflake-test-coverage downloads them and uploads
# to https://snowflake.codecov.io (GHA cannot reach Dedicated — WAF 403).
# Codecov merges reports for the same commit SHA; do not combine locally.

permissions:
  contents: read

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
  schedule:
    - cron: '7 3 * * *'
  workflow_dispatch:
    inputs:
      goTestParams:
        default:
        description: 'Parameters passed to go test'
      sequentialTests:
        type: boolean
        default: false
        description: 'Run tests sequentially (no buffering, slower)'

concurrency:
  # older builds for the same pull request numer or branch should be cancelled
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Go version used by all single-version jobs (lint, *-no-home, fipsOnly,
  # *-minicore-disabled, ecc). Multi-version compatibility matrices below
  # intentionally pin literal versions and cannot reference env (GitHub
  # Actions does not expose the env context to strategy.matrix).
  GO_VERSION: '1.27'

jobs:
    lint:
        runs-on: ubuntu-latest
        name: Check linter
        steps:
          - uses: actions/checkout@v7
          - name: Setup go
            uses: actions/setup-go@v7
            with:
              go-version: ${{ env.GO_VERSION }}
          - name: golangci-lint
            uses: golangci/golangci-lint-action@v7
            with:
              # v2.13 release binaries are built with Go 1.26 and cannot
              # typecheck the Go 1.27 stdlib (export data v5 vs max v4).
              # v2.14.0 is built with Go 1.27.
              version: v2.14
          - name: Format, Lint
            shell: bash
            run: ./ci/build.sh
          - name: Run go fix across all platforms and tags
            shell: bash
            run: ./ci/gofix.sh
    build-test-linux:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                cloud: [ 'AWS', 'AZURE', 'GCP' ]
                go: [ '1.25', '1.26', '1.27' ]
        name: ${{ matrix.cloud }} Go ${{ matrix.go }} on Ubuntu
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v5 # for wiremock
              with:
                java-version: 17
                distribution: 'temurin'
            - name: Setup go
              uses: actions/setup-go@v7
              with:
                  go-version: ${{ matrix.go }}
            - name: Test
              shell: bash
              env:
                PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
                GOLANG_PRIVATE_KEY_SECRET: ${{ secrets.GOLANG_PRIVATE_KEY_SECRET }}
                CLOUD_PROVIDER: ${{ matrix.cloud }}
                GORACE: history_size=7
                GO_TEST_PARAMS: ${{ inputs.goTestParams }}
                SEQUENTIAL_TESTS: ${{ inputs.sequentialTests }}
                WIREMOCK_PORT: 14335
                WIREMOCK_HTTPS_PORT: 13567
              run: ./ci/test.sh
            - name: Upload test results to Codecov
              if: ${{!cancelled()}}
              uses: codecov/test-results-action@v1
              with:
                token: ${{ secrets.CODE_COV_UPLOAD_TOKEN }}
            - name: Upload coverage artifact
              if: ${{ !cancelled() }}
              uses: ./.github/actions/upload-coverage-artifact
              with:
                name: linux-${{ matrix.cloud }}-${{ matrix.go }}
    build-test-linux-no-home:
      runs-on: ubuntu-latest
      name: Ubuntu - no HOME
      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-java@v5 # for wiremock
          with:
            java-version: 17
            distribution: 'temurin'
        - name: Setup go
          uses: actions/setup-go@v7
          with:
            go-version: ${{ env.GO_VERSION }}
        - name: Test
          shell: bash
          env:
            PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
            GOLANG_PRIVATE_KEY_SECRET: ${{ secrets.GOLANG_PRIVATE_KEY_SECRET }}
            CLOUD_PROVIDER: AWS
            GORACE: history_size=7
            GO_TEST_PARAMS: ${{ inputs.goTestParams }}
            SEQUENTIAL_TESTS: ${{ inputs.sequentialTests }}
            WIREMOCK_PORT: 14335
            WIREMOCK_HTTPS_PORT: 13567
            HOME_EMPTY: "yes"
          run: ./ci/test.sh
        - name: Upload coverage artifact
          if: ${{ !cancelled() }}
          uses: ./.github/actions/upload-coverage-artifact
          with:
            name: linux-no-home
    build-test-mac:
        runs-on: macos-latest
        strategy:
            fail-fast: false
            matrix:
                cloud: [ 'AWS', 'AZURE', 'GCP' ]
                go: [ '1.25', '1.26', '1.27' ]
        name: ${{ matrix.cloud }} Go ${{ matrix.go }} on Mac
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v5 # for wiremock
              with:
                java-version: 17
                distribution: 'temurin'
            - name: Setup go
              uses: actions/setup-go@v7
              with:
                  go-version: ${{ matrix.go }}
            - name: Test
              shell: bash
              env:
                PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
                GOLANG_PRIVATE_KEY_SECRET: ${{ secrets.GOLANG_PRIVATE_KEY_SECRET }}
                CLOUD_PROVIDER: ${{ matrix.cloud }}
                GO_TEST_PARAMS: ${{ inputs.goTestParams }}
                WIREMOCK_PORT: 14335
                WIREMOCK_HTTPS_PORT: 13567
              run: ./ci/test.sh
            - name: Upload test results to Codecov
              if: ${{!cancelled()}}
              uses: codecov/test-results-action@v1
              with:
                token: ${{ secrets.CODE_COV_UPLOAD_TOKEN }}
            - name: Upload coverage artifact
              if: ${{ !cancelled() }}
              uses: ./.github/actions/upload-coverage-artifact
              with:
                name: mac-${{ matrix.cloud }}-${{ matrix.go }}
    build-test-mac-no-home:
      runs-on: macos-latest
      name: Mac - no HOME
      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-java@v5 # for wiremock
          with:
            java-version: 17
            distribution: 'temurin'
        - name: Setup go
          uses: actions/setup-go@v7
          with:
            go-version: ${{ env.GO_VERSION }}
        - name: Test
          shell: bash
          env:
            PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
            GOLANG_PRIVATE_KEY_SECRET: ${{ secrets.GOLANG_PRIVATE_KEY_SECRET }}
            CLOUD_PROVIDER: AWS
            GO_TEST_PARAMS: ${{ inputs.goTestParams }}
            WIREMOCK_PORT: 14335
            WIREMOCK_HTTPS_PORT: 13567
            HOME_EMPTY: "yes"
          run: ./ci/test.sh
        - name: Upload coverage artifact
          if: ${{ !cancelled() }}
          uses: ./.github/actions/upload-coverage-artifact
          with:
            name: mac-no-home
    build-test-windows:
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                cloud: [ 'AWS', 'AZURE', 'GCP' ]
                go: [ '1.25', '1.26', '1.27' ]
        name: ${{ matrix.cloud }} Go ${{ matrix.go }} on Windows
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v5 # for wiremock
              with:
                java-version: 17
                distribution: 'temurin'
            - name: Setup go
              uses: actions/setup-go@v7
              with:
                  go-version: ${{ matrix.go }}
            - uses: actions/setup-python@v7
              with:
                python-version: '3.x'
                architecture: 'x64'
            - name: Test
              shell: cmd
              env:
                PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
                GOLANG_PRIVATE_KEY_SECRET: ${{ secrets.GOLANG_PRIVATE_KEY_SECRET }}
                CLOUD_PROVIDER: ${{ matrix.cloud }}
                GO_TEST_PARAMS: ${{ inputs.goTestParams }}
                SEQUENTIAL_TESTS: ${{ inputs.sequentialTests }}
                WIREMOCK_PORT: 14335
                WIREMOCK_HTTPS_PORT: 13567
              run: ci\\test.bat
            - name: Upload test results to Codecov
              if: ${{!cancelled()}}
              uses: codecov/test-results-action@v1
              with:
                token: ${{ secrets.CODE_COV_UPLOAD_TOKEN }}
            - name: Upload coverage artifact
              if: ${{ !cancelled() }}
              uses: ./.github/actions/upload-coverage-artifact
              with:
                name: windows-${{ matrix.cloud }}-${{ matrix.go }}
    fipsOnly:
      runs-on: ubuntu-latest
      strategy:
        fail-fast: false
      name: FIPS only mode
      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-java@v5 # for wiremock
          with:
            java-version: 17
            distribution: 'temurin'
        - name: Setup go
          uses: actions/setup-go@v7
          with:
            go-version: ${{ env.GO_VERSION }}
        - name: Test
          shell: bash
          env:
            PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
            GOLANG_PRIVATE_KEY_SECRET: ${{ secrets.GOLANG_PRIVATE_KEY_SECRET }}
            CLOUD_PROVIDER: ${{ matrix.cloud }}
            GORACE: history_size=7
            GO_TEST_PARAMS: ${{ inputs.goTestParams }}
            TEST_GODEBUG: fips140=only
            SEQUENTIAL_TESTS: ${{ inputs.sequentialTests }}
            WIREMOCK_PORT: 14335
            WIREMOCK_HTTPS_PORT: 13567
          run: ./ci/test.sh
        - name: Upload test results to Codecov
          if: ${{!cancelled()}}
          uses: codecov/test-results-action@v1
          with:
            token: ${{ secrets.CODE_COV_UPLOAD_TOKEN }}
        - name: Upload coverage artifact
          if: ${{ !cancelled() }}
          uses: ./.github/actions/upload-coverage-artifact
          with:
            name: linux-fips
    build-test-linux-minicore-disabled:
      runs-on: ubuntu-latest
      name: Ubuntu - minicore disabled
      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-java@v5 # for wiremock
          with:
            java-version: 17
            distribution: 'temurin'
        - name: Setup go
          uses: actions/setup-go@v7
          with:
            go-version: ${{ env.GO_VERSION }}
        - name: Test
          shell: bash
          env:
            PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
            GOLANG_PRIVATE_KEY_SECRET: ${{ secrets.GOLANG_PRIVATE_KEY_SECRET }}
            CLOUD_PROVIDER: AWS
            GORACE: history_size=7
            GO_TEST_PARAMS: ${{ inputs.goTestParams }} -tags=minicore_disabled
            WIREMOCK_PORT: 14335
            WIREMOCK_HTTPS_PORT: 13567
          run: ./ci/test.sh
        - name: Upload coverage artifact
          if: ${{ !cancelled() }}
          uses: ./.github/actions/upload-coverage-artifact
          with:
            name: linux-minicore-disabled
    build-test-mac-minicore-disabled:
      runs-on: macos-latest
      name: Mac - minicore disabled
      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-java@v5 # for wiremock
          with:
            java-version: 17
            distribution: 'temurin'
        - name: Setup go
          uses: actions/setup-go@v7
          with:
            go-version: ${{ env.GO_VERSION }}
        - name: Test
          shell: bash
          env:
            PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
            GOLANG_PRIVATE_KEY_SECRET: ${{ secrets.GOLANG_PRIVATE_KEY_SECRET }}
            CLOUD_PROVIDER: AWS
            GO_TEST_PARAMS: ${{ inputs.goTestParams }} -tags=minicore_disabled
            WIREMOCK_PORT: 14335
            WIREMOCK_HTTPS_PORT: 13567
          run: ./ci/test.sh
        - name: Upload coverage artifact
          if: ${{ !cancelled() }}
          uses: ./.github/actions/upload-coverage-artifact
          with:
            name: mac-minicore-disabled
    build-test-windows-minicore-disabled:
      runs-on: windows-latest
      name: Windows - minicore disabled
      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-java@v5 # for wiremock
          with:
            java-version: 17
            distribution: 'temurin'
        - name: Setup go
          uses: actions/setup-go@v7
          with:
            go-version: ${{ env.GO_VERSION }}
        - uses: actions/setup-python@v7
          with:
            python-version: '3.x'
            architecture: 'x64'
        - name: Test
          shell: cmd
          env:
            PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
            GOLANG_PRIVATE_KEY_SECRET: ${{ secrets.GOLANG_PRIVATE_KEY_SECRET }}
            CLOUD_PROVIDER: AWS
            GO_TEST_PARAMS: ${{ inputs.goTestParams }} -tags=minicore_disabled
            WIREMOCK_PORT: 14335
            WIREMOCK_HTTPS_PORT: 13567
          run: ci\\test.bat
        - name: Upload coverage artifact
          if: ${{ !cancelled() }}
          uses: ./.github/actions/upload-coverage-artifact
          with:
            name: windows-minicore-disabled
    ecc:
      runs-on: ubuntu-latest
      strategy:
        fail-fast: false
      name: Elliptic curves check
      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-java@v5 # for wiremock
          with:
            java-version: 17
            distribution: 'temurin'
        - name: Setup go
          uses: actions/setup-go@v7
          with:
            go-version: ${{ env.GO_VERSION }}
        - name: Test
          shell: bash
          env:
            PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
            GOLANG_PRIVATE_KEY_SECRET: ${{ secrets.GOLANG_PRIVATE_KEY_SECRET }}
            CLOUD_PROVIDER: AWS
            GORACE: history_size=7
            GO_TEST_PARAMS: ${{ inputs.goTestParams }} -run TestQueryViaHttps
            WIREMOCK_PORT: 14335
            WIREMOCK_HTTPS_PORT: 13567
            WIREMOCK_ENABLE_ECDSA: true
          run: ./ci/test.sh
        - name: Upload coverage artifact
          if: ${{ !cancelled() }}
          uses: ./.github/actions/upload-coverage-artifact
          with:
            name: linux-ecc
    build-test-rockylinux9:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
              cloud_go:
              - cloud: 'AWS'
                go: '1.25.14'
              - cloud: 'AZURE'
                go: '1.26.7'
              - cloud: 'GCP'
                go: '1.27.0'
        name: ${{ matrix.cloud_go.cloud }} Go ${{ matrix.cloud_go.go }} on Rocky Linux 9
        steps:
            - uses: actions/checkout@v7
            - name: Test
              shell: bash
              env:
                PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
                GOLANG_PRIVATE_KEY_SECRET: ${{ secrets.GOLANG_PRIVATE_KEY_SECRET }}
                CLOUD_PROVIDER: ${{ matrix.cloud_go.cloud }}
                GORACE: history_size=7
                GO_TEST_PARAMS: ${{ inputs.goTestParams }}
                SEQUENTIAL_TESTS: ${{ inputs.sequentialTests }}
                WIREMOCK_PORT: 14335
                WIREMOCK_HTTPS_PORT: 13567
              run: ./ci/test_rockylinux9_docker.sh ${{ matrix.cloud_go.go }}
            - name: Upload coverage artifact
              if: ${{ !cancelled() }}
              uses: ./.github/actions/upload-coverage-artifact
              with:
                name: rockylinux9-${{ matrix.cloud_go.cloud }}-${{ matrix.cloud_go.go }}
    build-test-ubuntu-arm:
      runs-on: ubuntu-24.04-arm
      strategy:
        fail-fast: false
        matrix:
          cloud_go:
            - cloud: 'AWS'
              go: '1.25'
            - cloud: 'AZURE'
              go: '1.26'
            - cloud: 'GCP'
              go: '1.27'
      name: ${{ matrix.cloud_go.cloud }} Go ${{ matrix.cloud_go.go }} on Ubuntu ARM
      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-java@v5 # for wiremock
          with:
            java-version: 17
            distribution: 'temurin'
        - name: Setup go
          uses: actions/setup-go@v7
          with:
            go-version: ${{ matrix.cloud_go.go }}
        - name: Test
          shell: bash
          env:
            PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
            GOLANG_PRIVATE_KEY_SECRET: ${{ secrets.GOLANG_PRIVATE_KEY_SECRET }}
            CLOUD_PROVIDER: ${{ matrix.cloud_go.cloud }}
            GORACE: history_size=7
            GO_TEST_PARAMS: ${{ inputs.goTestParams }}
            WIREMOCK_PORT: 14335
            WIREMOCK_HTTPS_PORT: 13567
          run: ./ci/test.sh
        - name: Upload test results to Codecov
          if: ${{!cancelled()}}
          uses: codecov/test-results-action@v1
          with:
            token: ${{ secrets.CODE_COV_UPLOAD_TOKEN }}
        - name: Upload coverage artifact
          if: ${{ !cancelled() }}
          uses: ./.github/actions/upload-coverage-artifact
          with:
            name: ubuntu-arm-${{ matrix.cloud_go.cloud }}-${{ matrix.cloud_go.go }}
    build-test-windows-arm:
      runs-on: windows-11-arm
      strategy:
        fail-fast: false
        matrix:
          cloud_go:
            - cloud: 'AWS'
              go: '1.25'
            - cloud: 'AZURE'
              go: '1.26'
            - cloud: 'GCP'
              go: '1.27'
      name: ${{ matrix.cloud_go.cloud }} Go ${{ matrix.cloud_go.cloud }} on Windows ARM
      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-java@v5 # for wiremock
          with:
            java-version: 21
            distribution: 'temurin'
        - name: Setup go
          uses: actions/setup-go@v7
          with:
            go-version: ${{ matrix.cloud_go.go }}
        - uses: actions/setup-python@v7
          with:
            python-version: '3.x'
            architecture: 'x64'
        - name: Test
          shell: cmd
          env:
            PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
            GOLANG_PRIVATE_KEY_SECRET: ${{ secrets.GOLANG_PRIVATE_KEY_SECRET }}
            CLOUD_PROVIDER: ${{ matrix.cloud_go.cloud }}
            GO_TEST_PARAMS: ${{ inputs.goTestParams }}
            WIREMOCK_PORT: 14335
            WIREMOCK_HTTPS_PORT: 13567
          run: ci\\test.bat
        - name: Upload test results to Codecov
          if: ${{!cancelled()}}
          uses: codecov/test-results-action@v1
          with:
            token: ${{ secrets.CODE_COV_UPLOAD_TOKEN }}
        - name: Upload coverage artifact
          if: ${{ !cancelled() }}
          uses: ./.github/actions/upload-coverage-artifact
          with:
            name: windows-arm-${{ matrix.cloud_go.cloud }}-${{ matrix.cloud_go.go }}
